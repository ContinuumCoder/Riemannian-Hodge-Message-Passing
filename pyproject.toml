[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rhmp"
version = "2.0.0"
description = "Riemannian Hodge Message Passing v2: a PyTorch library for learning physical fields on meshes with exact cochain complexes, learned DEC/Whitney cochain metrics and a DEC toolkit"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Denzel Zheng" }, { name = "Christine Allen-Blanchette" }]
keywords = ["discrete exterior calculus", "cochain complex", "Hodge Laplacian", "message passing",
            "equivariance", "mesh", "PDE surrogate"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
# torch >= 2.4: rhmp.layers uses torch.amp.custom_fwd(device_type=...) and rhmp.ops uses
# torch.is_autocast_enabled(device_type), both introduced in torch 2.4 (validated with torch 2.10).
dependencies = ["torch>=2.4", "numpy", "scipy"]

[project.optional-dependencies]
viz = ["matplotlib"]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["rhmp", "rhmp.*"]

[tool.setuptools.package-data]
rhmp = ["py.typed"]
